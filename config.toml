[google_cloud]
service_account_file = "./service-account.json"

[tts]
# CORRECTED NAME: Removed the hyphen between Chirp and 3
# voice_name = "de-DE-Chirp3-HD-Fenrir"
# voice_name = "de-DE-Chirp3-HD-Erinome"
# voice_name = "de-DE-Chirp3-HD-Kore"
# voice_name = "de-DE-Chirp3-HD-Achernar"
# voice_name = "de-DE-Chirp3-HD-Orus"
# voice_name = "de-DE-Chirp3-HD-Despina"
# voice_name = "de-DE-Chirp3-HD-Aoede"
# voice_name = "de-DE-Chirp3-HD-Autonoe"
# voice_name = "de-DE-Chirp3-HD-Laomedeia"
# voice_name = "de-DE-Chirp3-HD-Gacrux"
voice_name = "de-DE-Chirp3-HD-Enceladus"

# Chirp 3 works best with uncompressed audio (WAV)
audio_encoding   = "LINEAR16" 
speaking_rate    = 0.85
output_dir       = "./output"
pitch            = 0.0

[files]
input_text        = "input.txt"
intermediate_data = "staging_data.json"
debug_file        = 'debug_dump.json'

[processing]
# Delimiter for separating text into different mp3 files
delimiter       = "---"
max_chunk_bytes = 4500

[cltk]
# Options: "Attic", "Koine"
dialect        = "Attic"
reconstruction = "Probert" # Probert is generally considered very accurate for Attic

[pauses]
# Adjust these to change the rhythm of the speech
# These are scaled automatically by speaking_rate
breath  = "145ms" # For "out of breath"
comma   = "80ms"  # For , and :
period  = "145ms" # For . and ; and —
minor   = "215ms" # For · and -
newline = "180ms" # For line breaks (empty new lines)
skip    = "50ms"  # For skipped non-Greek text (headers/numbers)

[pacing]
# Breath Logic
max_breath_words   = 9  # Minimum words before looking for a breath spot
force_breath_words = 20 # Force a breath if no natural spot found by this count

[prosody]
# PITCH SETTINGS (Integers representing % change)
contour_peak        = 35     # The "Singing" peak of an Acute accent relative to current baseline
contour_grave       = 5      # The suppressed pitch of a Grave accent
contour_end         = -12    # How far pitch drops at the end of a word
circumflex_tail_len = 15     # Length of the Circumflex fall (% of word duration)
heavy_word_rate     = "-15%" # Speed slowdown for heavy words (e.g. -15%)
# DOWNDRIFT (The "Human" Factor)
# Sentences start high and drift lower. 
# This prevents the "Robot List" effect.
downdrift_start =  10  # Start sentence higher than average
downdrift_end   = -10  # End sentence lower than average
updrift_start   = -5   # Used if sentence ends with ; we use updrift instead
updrift_end     =  10 

# Rewind the downdrift logic slightly to "lift" the voice up after a pause, preventing the end of long sentences from growling.
downdrift_clause_based_rewind_scale = 0.35 

[options]
apply_sandhi          = true # Glue words ending in apostrophe (ἀλλ᾽ ἐγὼ -> ἀλλ᾽ἐγὼ)
apply_rough_breathing = true # Pronounce the 'h' (dasia)

voiceless_rho_combining = false   # true = r̥ (IPA combining ring), false = hr (safe fallback)

dry_run = false
